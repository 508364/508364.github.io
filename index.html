<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>508364's GitHub Projects</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="alternate icon" class="js-site-favicon" type="image/png" href="https://github.githubassets.com/favicons/favicon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/github.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header-top">
            <div class="avatar-container">
                <img src="" alt="User Avatar" class="avatar" id="userAvatar">
                <div class="user-info">
                    <h2 id="userName">508364</h2>
                    <p id="userBio">GitHub Projects Collection</p>
                </div>
            </div>
            <select class="lang-select" id="langSelect">
                <option value="zh">中文</option>
                <option value="en">English</option>
            </select>
        </div>
        <div class="search-container">
            <i class="fas fa-search search-icon"></i>
            <input type="text" class="search-input" id="searchInput" placeholder="搜索项目名称...">
        </div>
    </header>

    <div class="loading" id="loading">正在加载项目数据...</div>
    <div class="no-result" id="noResult">未找到匹配的项目</div>
    <div class="projects-container" id="projectsContainer"></div>

    <div class="modal" id="projectModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">项目详情</h3>
                <button class="modal-close-btn" id="closeModalBtn">&times;</button>
            </div>
            <div class="modal-body">
                <div class="modal-left">
                    <div class="readme-section">
                        <h4>项目说明</h4>
                        <div class="readme-content" id="readmeContent">
                            <div class="loading" id="readmeLoading">正在加载说明文档...</div>
                            <div class="error" id="readmeError" style="display: none;"></div>
                        </div>
                    </div>
                </div>
                <div class="modal-right">
                    <div class="repo-info-section">
                        <h4>仓库信息</h4>
                        <div class="repo-info" id="repoInfo">
                            <div class="info-item">
                                <span class="info-label">仓库名称:</span>
                                <span class="info-value" id="repoName"></span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">语言:</span>
                                <span class="info-value" id="repoLanguage"></span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">创建时间:</span>
                                <span class="info-value" id="repoCreated"></span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">更新时间:</span>
                                <span class="info-value" id="repoUpdated"></span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">星标数:</span>
                                <span class="info-value" id="repoStars"></span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">分支数:</span>
                                <span class="info-value" id="repoForks"></span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="modal-btn" id="gotoRepoBtn">打开仓库</button>
                <button class="modal-btn" id="gotoWebBtn" style="display: none;">打开网页</button>
            </div>
        </div>
    </div>

    <button class="theme-toggle" id="themeToggle">
        <i class="fas fa-moon"></i>
    </button>

    <!-- 数据映射表配置 -->
    <script id="configData" type="application/json">
    {
        "dataMap": {
            "chmlfrp": "https://panel.chmlfrp.net/tunnel/download",
            "chmlfrpwin386": "https://cf-v1.uapis.cn/download/ChmlFrp-0.51.2_251023_windows_386.zip",
            "chmlfrpwinamd64": "https://cf-v1.uapis.cn/download/ChmlFrp-0.51.2_251023_windows_amd64.zip",
            "chmlfrpwinarm64": "https://cf-v1.uapis.cn/download/ChmlFrp-0.51.2_251023_windows_arm64.zip",
            "default": "Hello GitHub Pages!"
        }
    }
    </script>
    
    <script src="marked.min.js"></script>
    <script src="highlight.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
